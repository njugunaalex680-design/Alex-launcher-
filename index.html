
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050008">
  <title>Alex Launcher</title>
  <link rel="stylesheet" href="./style.css?v=4">
</head>
<body>

  <main class="launcher">

    <header class="status-bar">
      <span id="status-time">09:41</span>
      <span>● ● ● ▰</span>
    </header>

    <section class="clock-section">
      <div>
        <h1 id="clock">09:41</h1>
        <p id="date">Wednesday, 18 November</p>
      </div>

      <div class="weather">
        <span>☁️</span>
        <h2>18°C</h2>
        <p>Weather</p>
      </div>
    </section>

    <section class="search-box">
      <span>⌕</span>
      <input id="search" type="text" placeholder="Search apps...">
      <span>🎙</span>
    </section>

    <section class="favourites">
      <div class="app">
        <span>▶️</span>
        <p>YouTube</p>
      </div>
      <div class="app">
        <span>💬</span>
        <p>Messages</p>
      </div>
      <div class="app">
        <span>🌐</span>
        <p>Browser</p>
      </div>
      <div class="app">
        <span>📷</span>
        <p>Camera</p>
      </div>
    </section>

    <section class="app-wheel">

      <div class="wheel-item top">
        <span>📷</span>
        <p>Camera</p>
      </div>

      <div class="wheel-item right">
        <span>⚙️</span>
        <p>Settings</p>
      </div>

      <div class="wheel-item bottom-right">
        <span>▦</span>
        <p>Apps</p>
      </div>

      <div class="wheel-item bottom">
        <span>👥</span>
        <p>Contacts</p>
      </div>

      <div class="wheel-item bottom-left">
        <span>📞</span>
        <p>Phone</p>
      </div>

      <div class="wheel-item left">
        <span>🖼️</span>
        <p>Gallery</p>
      </div>

      <div class="wheel-center">A</div>

    </section>

    <nav class="bottom-dock">
      <span>📞</span>
      <span>💬</span>
      <span id="open-apps">⠿</span>
      <span>👤</span>
      <span>📷</span>
    </nav>

  </main>

<!-- APP DRAWER -->
<section class="app-drawer" id="app-drawer">

  <div class="drawer-header">
    <h2>All Apps</h2>
    <button class="drawer-close" id="drawer-close">×</button>
  </div>

  <div class="drawer-search">
    <span>🔍</span>
    <input id="drawer-search" type="text" placeholder="Search apps...">
  </div>

  <div class="drawer-categories">
    <button class="selected" data-category="All">All</button>
    <button data-category="Social">Social</button>
    <button data-category="Games">Games</button>
    <button data-category="Tools">Tools</button>
    <button data-category="Media">Media</button>
    <button data-category="Education">Education</button>
    <button data-category="Productivity">Productivity</button>
  </div>

  <div class="drawer-content">
    <div class="drawer-all">
      <h3 id="drawer-heading">All Applications</h3>
      <div class="drawer-grid" id="drawer-grid"></div>
    </div>

    <div class="drawer-alphabet" id="drawer-alphabet">
      <button data-letter="A">A</button>
      <button data-letter="B">B</button>
      <button data-letter="C">C</button>
      <button data-letter="D">D</button>
      <button data-letter="E">E</button>
      <button data-letter="F">F</button>
      <button data-letter="G">G</button>
      <button data-letter="H">H</button>
      <button data-letter="I">I</button>
      <button data-letter="J">J</button>
      <button data-letter="K">K</button>
      <button data-letter="L">L</button>
      <button data-letter="M">M</button>
      <button data-letter="N">N</button>
      <button data-letter="O">O</button>
      <button data-letter="P">P</button>
      <button data-letter="Q">Q</button>
      <button data-letter="R">R</button>
      <button data-letter="S">S</button>
      <button data-letter="T">T</button>
      <button data-letter="U">U</button>
      <button data-letter="V">V</button>
      <button data-letter="W">W</button>
      <button data-letter="X">X</button>
      <button data-letter="Y">Y</button>
      <button data-letter="Z">Z</button>
    </div>
  </div>

        </section>
  
  <script src="./script.js"></script>
</body>
</html>
