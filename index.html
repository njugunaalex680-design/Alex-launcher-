
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050008">
  <title>Alex Launcher</title>
  <link rel="stylesheet" href="./style.css?v=4">
</head>
<body>

  <main class="launcher">

    <header class="status-bar">
      <span id="status-time">09:41</span>
      <span>● ● ● ▰</span>
    </header>

    <section class="clock-section">
      <div>
        <h1 id="clock">09:41</h1>
        <p id="date">Wednesday, 18 November</p>
      </div>

      <div class="weather">
        <span>☁️</span>
        <h2>18°C</h2>
        <p>Weather</p>
      </div>
    </section>

    <section class="search-box">
      <span>⌕</span>
      <input id="search" type="text" placeholder="Search apps...">
      <span>🎙</span>
    </section>

    <section class="favourites">
      <div class="app">
        <span>▶️</span>
        <p>YouTube</p>
      </div>
      <div class="app">
        <span>💬</span>
        <p>Messages</p>
      </div>
      <div class="app">
        <span>🌐</span>
        <p>Browser</p>
      </div>
      <div class="app">
        <span>📷</span>
        <p>Camera</p>
      </div>
    </section>

    <section class="app-wheel">

      <div class="wheel-item top">
        <span>📷</span>
        <p>Camera</p>
      </div>

      <div class="wheel-item right">
        <span>⚙️</span>
        <p>Settings</p>
      </div>

      <div class="wheel-item bottom-right">
        <span>▦</span>
        <p>Apps</p>
      </div>

      <div class="wheel-item bottom">
        <span>👥</span>
        <p>Contacts</p>
      </div>

      <div class="wheel-item bottom-left">
        <span>📞</span>
        <p>Phone</p>
      </div>

      <div class="wheel-item left">
        <span>🖼️</span>
        <p>Gallery</p>
      </div>

      <div class="wheel-center">A</div>

    </section>

    <nav class="bottom-dock">
      <span>📞</span>
      <span>💬</span>
      <span id="open-apps">⠿</span>
      <span>👤</span>
      <span>📷</span>
    </nav>

  </main>

  <script src="./script.js"></script>
</body>
</html>
